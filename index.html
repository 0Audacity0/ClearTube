/* Refined controls and calmer spacing */
:root{--accent:#f04455;--accent2:#ff6675;--radius:16px}
body{letter-spacing:-.12px}
.topbar{height:70px;padding-inline:clamp(14px,2.4vw,34px);gap:18px}
.brand{font-size:20px;letter-spacing:-.9px}.logo{width:33px;height:25px;border-radius:8px}
.search input{border-radius:999px;padding:12px 18px;background:var(--panel);border-color:transparent;transition:border-color .18s,box-shadow .18s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f044551b}
.search button,.primary{border-radius:999px;padding:11px 18px;box-shadow:none;transition:background .18s,transform .18s}
.search button:hover,.primary:hover{transform:translateY(-1px)}
.iconbtn,.secondary{border-radius:999px;padding:9px 14px;transition:background .18s,border-color .18s}
.sidebar{padding-top:20px}.navitem{border-radius:10px;padding:10px 12px}.navitem.active{box-shadow:inset 2px 0 var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.main{padding-top:30px}.hero h1{font-size:clamp(28px,2.7vw,36px);letter-spacing:-1.5px}.hero p{font-size:14px;line-height:1.65}
.chip{padding:8px 14px;border-color:transparent;background:var(--panel);transition:all .15s}.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.video-grid{gap:26px 20px}.thumb{border:0;border-radius:13px;background:var(--panel2)}.card-row{gap:10px}.avatar{width:35px;height:35px;flex-basis:35px}.video-info h3{font-size:13.5px;letter-spacing:-.2px}.video-info p{line-height:1.45}
.section-head{margin-top:25px}.setting-card{border-radius:18px;padding:21px;border-color:var(--line);box-shadow:0 3px 16px #00000008}.setting-card h3{font-size:16px;letter-spacing:-.3px}.setting-card p{line-height:1.6}.setting-card input[type=text],.setting-card input[type=password],.setting-card select{border-radius:11px;padding:12px 13px;outline:none;transition:border-color .15s,box-shadow .15s}.setting-card input[type=text]:focus,.setting-card input[type=password]:focus,.setting-card select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f0445518}
/* Modern pill switches, replacing the browser-default checkboxes */
.toggle-row{padding:14px 0;min-height:51px;gap:18px}.toggle-row span{color:var(--text);font-size:13px;line-height:1.45}.toggle-row input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;flex:0 0 42px;width:42px;height:25px;margin:0;border:1px solid #5a5f6b;border-radius:999px;background:#343843;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;outline:none}.toggle-row input[type=checkbox]::before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;border-radius:50%;background:#f5f6f8;box-shadow:0 1px 3px #0004;transition:transform .2s cubic-bezier(.2,.8,.2,1),background .2s}.toggle-row input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}.toggle-row input[type=checkbox]:checked::before{transform:translateX(17px);background:white}.toggle-row input[type=checkbox]:focus-visible{box-shadow:0 0 0 4px #f0445530}.toggle-row input[type=checkbox]:disabled{opacity:.55;cursor:not-allowed}
.notice{border-radius:12px;line-height:1.6;padding:13px 14px}.watch-side{border-radius:16px}.player{border-radius:15px}.watch-actions .secondary{font-size:13px}

/* Premium sticky search + category rail */
.header-stack{position:sticky;top:0;z-index:30;background:rgba(13,14,18,.88);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-bottom:1px solid #ffffff0d;box-shadow:0 12px 34px #00000014}
.topbar{position:relative;top:auto;border-bottom:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.category-dock{border-top:1px solid #ffffff08;padding:0 clamp(14px,2.4vw,34px) 10px  }
.category-inner{max-width:100%;display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:7px 0 0}
.category-inner::-webkit-scrollbar{display:none}
.category-inner .chip{flex:0 0 auto;padding:6px 11px;font-size:11px;font-weight:650;letter-spacing:.1px;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--muted);line-height:1.2;transition:color .18s,background .18s,border-color .18s,transform .18s}
.category-inner .chip:hover{background:var(--panel2);color:var(--text);border-color:var(--line);transform:translateY(-1px)}
.category-inner .chip.active{background:linear-gradient(135deg,#ff6573,#e93d53);border-color:#ff7a87;color:white;box-shadow:0 3px 12px #f0445533}
.dock-hidden{display:none!important}.category-dock.filters-off{display:none!important}
.light .header-stack{background:rgba(248,249,252,.9);border-bottom-color:#1719200d;box-shadow:0 12px 34px #1c23400a}
.light .category-dock{border-top-color:#1719200c}
.light .category-inner .chip.active{background:linear-gradient(135deg,#ff6573,#e93d53);color:white;border-color:#ff7a87}
/* Extra-polished toggle controls: luminous track, inset groove, glassy thumb */
.toggle-row input[type=checkbox]{appearance:none;-webkit-appearance:none;position:relative;isolation:isolate;flex:0 0 48px;width:48px;height:28px;margin:0;padding:0;border:1px solid #555b69;border-radius:999px;background:linear-gradient(145deg,#30343e,#20232b);cursor:pointer;box-shadow:inset 0 2px 4px #0006,0 1px 0 #ffffff08;transition:background .28s,border-color .28s,box-shadow .28s;outline:none}
.toggle-row input[type=checkbox]::before{content:"";position:absolute;z-index:1;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:linear-gradient(145deg,#fff,#d9dce4);box-shadow:0 2px 5px #0005,inset 0 1px 1px #fff;transition:transform .28s cubic-bezier(.2,.9,.25,1.25),background .2s,box-shadow .2s}
.toggle-row input[type=checkbox]::after{content:"";position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#777e8c;opacity:.65;transition:transform .28s,opacity .2s,background .2s}
.toggle-row input[type=checkbox]:checked{background:linear-gradient(135deg,#ff7580,#e52f4b);border-color:#ff7b89;box-shadow:inset 0 1px 3px #9e17344d,0 0 0 3px #f0445510,0 4px 14px #f0445520}
.toggle-row input[type=checkbox]:checked::before{transform:translateX(20px);background:linear-gradient(145deg,#fff,#fff0f1);box-shadow:0 2px 7px #8e152c55,inset 0 1px 1px #fff}
.toggle-row input[type=checkbox]:checked::after{transform:translateX(20px);background:#ff4d5d;opacity:.9}
.toggle-row input[type=checkbox]:focus-visible{box-shadow:0 0 0 4px #f0445540,0 4px 14px #f0445520}
.toggle-row input[type=checkbox]:hover:not(:disabled){border-color:var(--accent2);filter:brightness(1.08)}
.toggle-row input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
/* If a range slider is added later, keep it in the same design system */
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:6px;border-radius:999px;background:linear-gradient(90deg,#ff6573,#e93d53 50%,var(--panel2) 50%);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:linear-gradient(145deg,#fff,#ffe1e5);border:3px solid #f04455;box-shadow:0 2px 10px #f0445540;transition:transform .18s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #f04455;box-shadow:0 2px 10px #f0445540}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}


/* Larger premium treatment for the active For you item */
.sidebar .navitem[data-page="home"] {
  min-height: 48px;
  padding: 14px 15px;
  font-size: 15px;
  font-weight: 750;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--panel2)), var(--panel2));
  box-shadow: 0 5px 16px #0002, inset 0 1px 0 #ffffff0a;
  transition: background .18s, border-color .18s, transform .18s, box-shadow .18s;
}
.sidebar .navitem[data-page="home"] .ico { font-size: 20px; }
.sidebar .navitem[data-page="home"].active {
  color: var(--text);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 23%, var(--panel2)), var(--panel2));
  box-shadow: inset 3px 0 var(--accent), 0 5px 18px #f0445517;
}
.sidebar .navitem[data-page="home"]:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
@media(max-width:760px) {
  .sidebar .navitem[data-page="home"] {
    min-height: 40px;
    padding: 10px 13px;
    font-size: 13px;
  }
}


/* ClearTube range controls: matching accent, high-contrast thumb, touch-friendly hit area */
:root{--custom-glow:.35;--glow-shadow:0 0 10px #f0445533}
.iconbtn:hover,.secondary:hover,.navitem.active{box-shadow:0 0 calc(12px * var(--custom-glow)) color-mix(in srgb,var(--accent) 25%,transparent)}
.range-setting{margin-top:18px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 6%,var(--panel)),var(--panel))}
.range-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}

}

<body>
<div class="app">

</div>
</div>

<script>

const $=s=>document.querySelector(s);
const state={page:'home',query:'',category:'All',videos:[],current:null,apiKey:localStorage.getItem('ct_apiKey')||'AIzaSyDUtDUT1F1i8h28NFFKzQ5On623h-Nf51E',clientId:localStorage.getItem('ct_clientId')||'',signedIn:false};
const demoVideos=[
{id:'jfKfPfyJRdk',title:'lofi hip hop radio 📚 beats to relax / study to',channel:'Lofi Girl',views:'Live',age:'Live stream',duration:'LIVE',category:'Music',desc:'A calm place to focus, read, or unwind.'},
{id:'aqz-KE-bpKQ',title:'Big Buck Bunny — animated short film',channel:'Blender Studio',views:'12M views',age:'2 years ago',duration:'9:56',category:'Animation',desc:'An open animated short from Blender Studio.'},
{id:'ScMzIvxBSi4',title:'A relaxing video to put on in the background',channel:'Ambient Worlds',views:'840K views',age:'8 months ago',duration:'12:42',category:'Relaxing',desc:'A low-key background video.'},
{id:'ysz5S6PUM-U',title:'Creative coding: build something from scratch',channel:'Creative Lab',views:'2.1M views',age:'1 year ago',duration:'18:20',category:'Learning',desc:'An example video for your personal feed.'},

{id:'LXb3EKWsInQ',title:'Nature scenes in 4K — oceans and mountains',channel:'Nature Focus',views:'2.4M views',age:'10 months ago',duration:'4:02',category:'Relaxing',desc:'Nature footage for a quiet break.'},
{id:'dQw4w9WgXcQ',title:'A classic music video',channel:'Music Archive',views:'1B views',age:'15 years ago',duration:'3:33',category:'Music',desc:'A popular music video.'},
{id:'C0DPdy98e4c',title:'Make a simple animation',channel:'Creative Lab',views:'780K views',age:'9 months ago',duration:'11:06',category:'Learning',desc:'A short creative tutorial.'}

function getList(key){try{return JSON.parse(localStorage.getItem('ct_'+key)||'[]')}catch{return []}}
function setList(key,v){localStorage.setItem('ct_'+key,JSON.stringify(v))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function thumb(v){return `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(v){return `<article class="video-card" data-watch="${esc(v.id)}"><div class="thumb"><img loading="lazy" src="${thumb(v)}" alt=""><span class="duration">${esc(v.duration||'YouTube')}</span></div><div class="card-row"><div class="avatar">${esc((v.channel||'Y').slice(0,1).toUpperCase())}</div><div class="video-info"><h3>${esc(v.title)}</h3><p>${esc(v.channel||'YouTube')}</p><p>${esc(v.views||'')} · ${esc(v.age||'')}</p></div><button class="more" data-more="${esc(v.id)}" title="Video options">⋯</button></div></article>`}
function grid(videos,empty='Nothing here yet.'){return `<div class="video-grid">${videos.length?videos.map(card).join(''):`<div class="empty">${empty}</div>`}</div>`}
function categories(){return ['All','Music','Technology','Learning','Relaxing','Animation','Gaming','News','Science'].map(c=>`<button class="chip ${state.category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}
function render(){

  const main=$('#main');let content='';
  const dock=$('#categoryDock');dock.classList.toggle('dock-hidden',!(state.page==='home'));$('#headerChips').innerHTML=categories();
  if(state.page==='settings'){main.innerHTML=settingsHTML();applyRangeSettings();return}
  if(state.page==='watch'&&state.current){const v=state.current;const recent=getList('recent');const suggestions=state.videos.filter(x=>x.id!==v.id).slice(0,5);main.innerHTML=`<div class="watch-layout"><section><div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=0&rel=0" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><h1 class="watch-title">${esc(v.title)}</h1><div class="watch-meta">${esc(v.channel||'YouTube')} · ${esc(v.views||'')} · ${esc(v.age||'')}</div><div class="watch-actions"><button class="secondary" data-action="like" data-id="${esc(v.id)}">♡ Like</button><button class="secondary" data-action="save" data-id="${esc(v.id)}">＋ Watch later</button><button class="secondary" data-action="copy" data-id="${esc(v.id)}">↗ Copy video link</button><button class="secondary" data-action="download" data-id="${esc(v.id)}">↓ Download MP4</button><button class="secondary" data-action="back">← Back to videos</button></div><p style="color:var(--muted);font-size:13px">${esc(v.desc||'')}</p><div class="notice">Videos play using YouTube's official embedded player. Ads, playback rules, and some features are controlled by YouTube.</div></section><aside class="watch-side"><h3>Up next · based on this session</h3>${suggestions.map(x=>`<div class="mini-video" data-watch="${esc(x.id)}"><img src="${thumb(x)}" alt=""><div><b>${esc(x.title)}</b><small>${esc(x.channel||'YouTube')}</small></div></div>`).join('')||'Search to find more videos'}</aside></div>`;return}
  let videos=state.videos;
  if(state.page==='recent'){videos=getList('recent');content=`<div class="hero"><div><div class="eyebrow">Pick up where you left off</div><h1>Recently watched</h1><p>Your recent videos on this device, newest first.</p></div><button class="secondary" data-action="clear-recent">Clear history</button></div>${grid(videos,'Videos you watch here will show up in this section.')}`}
  else if(state.page==='saved'){videos=getList('saved');content=`<div class="hero"><div><div class="eyebrow">Keep for later</div><h1>Watch later</h1><p>A personal queue for videos you want to come back to.</p></div></div>${grid(videos,'Save videos with the Watch later button.')}`}
  else if(state.page==='liked'){videos=getList('liked');content=`<div class="hero"><div><div class="eyebrow">Your favorites</div><h1>Liked videos</h1><p>Videos you have liked in ClearTube.</p></div></div>${grid(videos,'Like a video to see it here.')}`}
  else if(state.page==='history'){videos=getList('recent');content=`<div class="hero"><div><div class="eyebrow">Your activity</div><h1>Watch history</h1><p>History is stored locally in this browser, not synced to YouTube.</p></div><button class="secondary" data-action="clear-recent">Clear history</button></div>${grid(videos,'Your ClearTube viewing history will appear here.')}`}
  else {let shown=videos;if(state.category!=='All')shown=shown.filter(v=>(v.category||'').toLowerCase()===state.category.toLowerCase());content=`${!state.query?`<div class="section-head"><div><h2>${state.signedIn?'Picked for you':'Your feed'}</h2><p>${state.signedIn?'Based on videos you watch, save, and like in ClearTube.':'Sign in and watch or like videos to help shape your feed, or search YouTube to get started.'}</p></div></div>`:`<div class="section-head"><div><h2>Search results</h2><p>${shown.length} videos</p></div></div>`}${grid(shown,state.query?'No videos match this filter. Try another category or search.':(state.signedIn?'Your personalized feed will grow as you watch, save, and like videos here. Search YouTube to get started.':'No starter videos are shown. Search YouTube or sign in to start building your feed.'))}`}
  main.innerHTML=content;
}
function settingsHTML(){return `<div class="hero"><div><div class="eyebrow">Make it yours</div><h1>Customize ClearTube</h1><p>Set up live search, choose your look, and decide how your home feed behaves.</p></div></div><div class="settings">
<div class="setting-card"><h3>Appearance</h3><p>Choose a visual style that feels comfortable.</p><label for="themeSelect">Theme</label><select id="themeSelect"><option value="dark">Midnight dark</option><option value="light">Clean light</option></select><label for="densitySelect">Video layout</label><select id="densitySelect"><option value="comfortable">Comfortable</option><option value="compact">Compact</option></select><div class="toggle-row"><span>Show category filters</span><input type="checkbox" id="showFilters" checked></div><div class="toggle-row"><span>Reduce motion</span><input type="checkbox" id="reduceMotion"></div>
<div class="range-setting"><div class="range-heading"><label for="glowRange">Accent glow</label><output id="glowValue">35%</output></div><input type="range" id="glowRange" min="0" max="100" value="35" aria-label="Accent glow intensity"><p class="range-help">Control how much glow appears around highlighted controls.</p></div>
<div class="range-setting"><div class="range-heading"><label for="roundRange">Corner roundness</label><output id="roundValue">16 px</output></div><input type="range" id="roundRange" min="8" max="26" value="16" aria-label="Card corner roundness"><p class="range-help">Adjust the roundness of video cards and panels.</p></div>
</div>
<div class="setting-card"><h3>YouTube search</h3><p>Connect the official YouTube Data API to search real videos. The API key is saved only in this browser.</p><label for="apiKey">YouTube Data API v3 key</label><input id="apiKey" type="password" placeholder="Paste your API key" value="${esc(state.apiKey)}" autocomplete="off"><button class="primary" style="margin-top:12px" id="saveApi">Save API key</button><div class="notice"><b>Setup:</b> In Google Cloud Console, create a project, enable “YouTube Data API v3,” and create an API key. Restrict it to your GitHub Pages domain. Never put private server credentials in this file.</div></div>
<div class="setting-card"><h3>Google sign-in</h3><p>Sign-in requires a Google OAuth web client ID and an authorized origin. This starter does not request your password.</p><label for="clientId">Google OAuth Client ID</label><input id="clientId" type="text" placeholder="1234567890-abc.apps.googleusercontent.com" value="${esc(state.clientId)}" autocomplete="off"><button class="primary" style="margin-top:12px" id="saveClient">Save client ID</button><div class="notice"><b>Important:</b> Sign-in alone does not grant YouTube history access. Private account data needs a separately configured OAuth flow and the correct YouTube API scopes. This page does not read your Google password or claim to sync your YouTube account.</div></div>
<div class="setting-card"><h3>Recommendations</h3><p>Choose how the home feed is shaped. ClearTube's starter recommendations are simple and transparent.</p><div class="toggle-row"><span>Hide autoplay (player default)</span><input type="checkbox" checked disabled></div><div class="toggle-row"><span>Use my ClearTube watch history for local suggestions</span><input type="checkbox" id="localRecs" checked></div><div class="toggle-row"><span>Show demo feed when search is empty</span><input type="checkbox" id="demoFeed" checked></div><button class="secondary" id="clearAll" style="margin-top:13px">Clear local data</button></div>
<div class="setting-card"><h3>Data & privacy</h3><p>Your preferences, saved list, liked list, and ClearTube viewing history use this browser's local storage.</p><p>Embedded videos are served by YouTube. Searching through the API sends search terms to Google. GitHub Pages is static hosting, so account-linked features need careful OAuth setup.</p><button class="secondary" id="exportData">Export my local data</button></div>
</div><div class="footer">ClearTube is an independent interface concept, not affiliated with YouTube or Google. YouTube is a trademark of Google LLC.</div>`}
async function searchYouTube(q){if(!state.apiKey){state.query=q;state.page='home';render();toast('Add a YouTube API key in Customize to search live YouTube videos.');return}try{const url=new URL('https://www.googleapis.com/youtube/v3/search');url.search=new URLSearchParams({part:'snippet',type:'video',maxResults:'24',q,key:state.apiKey,safeSearch:'moderate'}).toString();const res=await fetch(url);const data=await res.json();if(!res.ok)throw new Error(data.error?.message||'Search failed');state.videos=(data.items||[]).map(x=>({id:x.id.videoId,title:x.snippet.title,channel:x.snippet.channelTitle,views:'YouTube result',age:new Date(x.snippet.publishedAt).toLocaleDateString(),duration:'YouTube',category:'Search',desc:x.snippet.description}));state.query=q;state.category='All';state.page='home';render();if(!state.videos.length)toast('No results found.')}catch(e){toast('YouTube search error: '+e.message)}}
function openVideo(id){let v=state.videos.find(x=>x.id===id)||demoVideos.find(x=>x.id===id)||getList('recent').find(x=>x.id===id)||getList('saved').find(x=>x.id===id)||getList('liked').find(x=>x.id===id);if(!v)return;state.current=v;state.page='watch';const recent=getList('recent').filter(x=>x.id!==id);setList('recent',[v,...recent].slice(0,60));render()}
document.addEventListener('click',e=>{
 const page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;render();return}
 const cat=e.target.closest('[data-category]');if(cat){state.category=cat.dataset.category;render();return}
 const watch=e.target.closest('[data-watch]');if(watch){openVideo(watch.dataset.watch);return}
 const more=e.target.closest('[data-more]');if(more){e.stopPropagation();const id=more.dataset.more;const v=state.videos.find(x=>x.id===id);if(v){const saved=getList('saved');setList('saved',saved.some(x=>x.id===id)?saved.filter(x=>x.id!==id):[v,...saved]);toast(saved.some(x=>x.id===id)?'Removed from Watch later':'Added to Watch later')}return}
 const act=e.target.closest('[data-action]');if(act){const action=act.dataset.action,id=act.dataset.id,v=state.current||state.videos.find(x=>x.id===id);if(action==='back'){state.page='home';render()}if(action==='like'&&v){let a=getList('liked');setList('liked',a.some(x=>x.id===id)?a.filter(x=>x.id!==id):[v,...a]);toast('Liked videos updated')}if(action==='save'&&v){let a=getList('saved');setList('saved',a.some(x=>x.id===id)?a.filter(x=>x.id!==id):[v,...a]);toast('Watch later updated')}if(action==='copy'&&v){navigator.clipboard?.writeText('https://www.youtube.com/watch?v='+id);toast('YouTube link copied if clipboard access is allowed')}if(action==='download'&&v){
 const url=v.downloadUrl||v.mp4Url||'';
 if(url){
   try{
     const parsed=new URL(url,location.href);
     if(parsed.protocol!=='https:'&&parsed.protocol!=='http:')throw new Error('Invalid URL');
     const a=document.createElement('a');a.href=parsed.href;a.download=(String(v.title||'video').replace(/[^a-z0-9-_ ]/gi,'').trim()||'video')+'.mp4';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
     toast('Download started, if the source permits it');
   }catch(err){toast('This download link is not valid')}
 }else{
   toast('YouTube embeds do not provide direct MP4 downloads. Use an official download option or a file you have permission to download.');
 }
}if(action==='clear-recent'){setList('recent',[]);render();toast('Local watch history cleared')}return}
});
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#searchInput').value.trim();if(q)searchYouTube(q)});
$('#homeBrand').addEventListener('click',e=>{e.preventDefault();state.page='home';state.query='';state.category='All';state.videos=[];render()});
$('#themeBtn').addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('ct_theme',document.body.classList.contains('light')?'light':'dark')});
function beginGoogleSignIn(){
  if(!state.clientId){state.page='settings';render();toast('Add your Google OAuth Client ID in Customize first.');return}
  if(!window.google?.accounts?.id){
    if(!document.getElementById('google-gsi-script')){const script=document.createElement('script');script.id='google-gsi-script';script.src='https://accounts.google.com/gsi/client';script.async=true;script.onload=beginGoogleSignIn;script.onerror=()=>toast('Google sign-in library could not load.');document.head.appendChild(script)}
    return;
  }
  google.accounts.id.initialize({client_id:state.clientId,callback:credentialResponse=>{
    try{const payload=JSON.parse(atob(credentialResponse.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));state.signedIn=true;$('#signInBtn').textContent=payload.name||'Google account';localStorage.setItem('ct_googleName',payload.name||'Google account');localStorage.setItem('ct_googleEmail',payload.email||'');toast('Signed in as '+(payload.name||'Google account')+'. Building your ClearTube feed from activity in this browser.');
      const activity=[...getList('liked'),...getList('saved'),...getList('recent')];
      if(activity.length){
        const counts={};activity.forEach(item=>{const cat=item.category||'popular videos';counts[cat]=(counts[cat]||0)+1});
        const interest=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
        searchYouTube(interest==='popular videos'?'popular videos':interest+' videos');
      }else{
        state.page='home';state.query='';state.videos=[];render();
      }}catch{toast('Google responded, but profile details could not be read.')}}});
  google.accounts.id.prompt();
}
$('#signInBtn').addEventListener('click',beginGoogleSignIn);
const savedGoogleName=localStorage.getItem('ct_googleName');if(savedGoogleName){$('#signInBtn').textContent=savedGoogleName;state.signedIn=true;}
document.addEventListener('click',e=>{
 if(e.target.id==='saveApi'){state.apiKey=$('#apiKey').value.trim();localStorage.setItem('ct_apiKey',state.apiKey);toast(state.apiKey?'API key saved in this browser.':'API key cleared.')}
 if(e.target.id==='saveClient'){state.clientId=$('#clientId').value.trim();localStorage.setItem('ct_clientId',state.clientId);toast('Client ID saved. Complete OAuth configuration before enabling sign-in.')}
 if(e.target.id==='clearAll'&&confirm('Clear ClearTube history, saved videos, likes, and preferences?')){['recent','saved','liked'].forEach(k=>localStorage.removeItem('ct_'+k));localStorage.removeItem('ct_apiKey');localStorage.removeItem('ct_clientId');state.apiKey='';state.clientId='';toast('Local ClearTube data cleared.');render()}
 if(e.target.id==='exportData'){const data={recent:getList('recent'),saved:getList('saved'),liked:getList('liked'),theme:localStorage.getItem('ct_theme')||'dark'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cleartube-data.json';a.click();URL.revokeObjectURL(a.href)}
});
function applyRangeSettings(){
 const glow=Number(localStorage.getItem('ct_glow')||35);
 const round=Number(localStorage.getItem('ct_roundness')||16);
 document.documentElement.style.setProperty('--custom-glow',`${glow/100}`);
 document.documentElement.style.setProperty('--radius',`${round}px`);
 const g=$('#glowRange'),r=$('#roundRange'),go=$('#glowValue'),ro=$('#roundValue');
 if(g&&go){g.value=glow;go.value=`${glow}%`;go.textContent=`${glow}%`}
 if(r&&ro){r.value=round;ro.value=`${round} px`;ro.textContent=`${round} px`}
}
document.addEventListener('input',e=>{
 if(e.target.id==='glowRange'){
   const v=Number(e.target.value);localStorage.setItem('ct_glow',String(v));
   document.documentElement.style.setProperty('--custom-glow',`${v/100}`);
   const o=$('#glowValue');if(o){o.value=`${v}%`;o.textContent=`${v}%`}
   document.documentElement.style.setProperty('--glow-shadow',`0 0 ${Math.round(v/4)}px color-mix(in srgb,var(--accent) ${v}%,transparent)`);
 }
 if(e.target.id==='roundRange'){
   const v=Number(e.target.value);localStorage.setItem('ct_roundness',String(v));
   document.documentElement.style.setProperty('--radius',`${v}px`);
   document.querySelectorAll('.thumb,.setting-card,.watch-side,.player,.range-setting').forEach(el=>el.style.borderRadius=`${v}px`);
   const o=$('#roundValue');if(o){o.value=`${v} px`;o.textContent=`${v} px`}
 }
});
document.addEventListener('change',e=>{
 if(e.target.id==='themeSelect'){document.body.classList.toggle('light',e.target.value==='light');localStorage.setItem('ct_theme',e.target.value)}
 if(e.target.id==='densitySelect'){document.querySelectorAll('.video-grid').forEach(g=>g.style.gap=e.target.value==='compact'?'14px 10px':'25px 18px');localStorage.setItem('ct_density',e.target.value)}
 if(e.target.id==='showFilters'){document.querySelectorAll('.chips').forEach(x=>x.classList.toggle('hidden',!e.target.checked));$('#categoryDock').classList.toggle('filters-off',!e.target.checked);localStorage.setItem('ct_showFilters',e.target.checked?'1':'0')}
 if(e.target.id==='reduceMotion'){document.body.style.setProperty('--motion',e.target.checked?'0':'1');document.querySelectorAll('*').forEach(x=>x.style.transitionDuration=e.target.checked?'0s':'');localStorage.setItem('ct_reduceMotion',e.target.checked?'1':'0')}
});
state.videos=[];
if(localStorage.getItem('ct_theme')==='light')document.body.classList.add('light');
applyRangeSettings();
render();
</script>
</body>
</html>
